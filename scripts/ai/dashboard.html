<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sim-game · pipeline</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
  .prog { display: flex; align-items: center; gap: var(--s3); min-width: 260px; }
  .prog .bar { flex: 1; min-width: 80px; }
  .quota { display: flex; align-items: center; gap: var(--s2); font-size: 12px; color: var(--muted); }
  .quota .bar { width: 48px; }
  .ms { margin-bottom: var(--s2); }
  .ms > summary { cursor: pointer; padding: var(--s2) var(--s2); display: flex; align-items: center; gap: var(--s3); list-style: none; border-radius: 8px; }
  .ms > summary:hover { background: var(--hover); }
  .ms > summary::-webkit-details-marker { display: none; }
  .ms > summary::before { content: ''; width: 6px; height: 6px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); transform: rotate(-45deg); transition: transform .15s; flex: none; margin: 0 2px; }
  .ms[open] > summary::before { transform: rotate(45deg); }
  .ms summary .bar { width: 80px; flex: none; }
  .ms .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t { display: grid; grid-template-columns: 40px minmax(120px, 1fr) 150px 56px 64px; gap: var(--s3); align-items: center; padding: 5px var(--s2) 5px 28px; border-radius: 8px; cursor: pointer; }
  .t:hover { background: var(--hover); }
  .t .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t.done .title { color: var(--muted); }
  .seg { display: flex; gap: 2px; align-items: center; }
  .seg i { flex: 1; height: 4px; border-radius: 2px; background: var(--raised); }
  .seg i.past { background: var(--ok); opacity: .55; } .seg i.cur { background: var(--accent); } .seg i.cur.wait { background: var(--warn); } .seg i.cur.blocked { background: var(--bad); }
  .seg.all i { background: var(--ok); opacity: .55; }
  .ev { display: grid; grid-template-columns: 132px 36px 76px 1fr; gap: var(--s3); font-size: 12px; padding: 3px 0; }
  .ev span:first-child, .commit span { white-space: nowrap; }
  .ev b { font-weight: 500; } .ev .e-decision, .ev .e-blocked { color: var(--warn); } .ev .e-done, .ev .e-merged, .ev .e-approved { color: var(--ok); } .ev .e-start { color: var(--accent-text); }
  #events { height: 280px; overflow: auto; }
  .item { padding: var(--s3) 0; border-bottom: 1px solid var(--line); } .item:last-child { border-bottom: 0; padding-bottom: 0; } .item:first-child { padding-top: 0; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); color: var(--muted); max-height: 200px; overflow: auto; }
  #toast { margin-top: var(--s3); font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; }
  .commit { display: grid; grid-template-columns: 56px 132px 1fr; gap: var(--s3); font-size: 12px; padding: 2px 0; }
  .commit span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 1250px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="topbar">
  <h1>AI pipeline</h1>
  <nav class="nav"><a class="on" href="/">Pipeline</a><a href="/stats">Token stats</a></nav>
  <div class="prog"><span id="msName" class="chip">–</span><div class="bar"><i id="bar" style="width:0"></i></div><span id="msCount" class="muted">–</span></div>
  <span class="sp"></span>
  <span id="qm" class="row" style="gap:16px"></span>
  <span id="orch" class="chip"><i class="dot"></i>idle</span>
  <span id="wk" class="chip">0 workers</span>
  <span id="updated" class="faint" style="font-size:12px"></span>
</div>
<main class="page">
 <div class="grid">
  <div class="stack">
    <section class="card"><h2>Task board <span class="sp"></span><span id="allCount" class="note"></span></h2><div id="board"></div></section>
    <section class="card"><h2>Events <span class="sp"></span><input id="evf" placeholder="Filter events" aria-label="Filter events" size="22"></h2><div id="events"></div></section>
  </div>
  <div class="stack">
    <section class="card"><h2>Deliverables</h2><div id="deliv"></div></section>
    <section class="card"><h2>Running workers</h2><div id="workers"></div></section>
    <section class="card"><h2>Decisions waiting</h2><div id="decisions"></div></section>
    <section class="card">
      <h2>Actions</h2>
      <div class="row">
        <button class="primary" id="bRun">Run orchestrator</button>
        <input id="only" placeholder="only: 020,021" size="14" aria-label="Only tasks">
        <span class="sp"></span>
        <button class="danger" id="bStop">Stop</button>
        <button id="bTest">npm test</button>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </section>
    <section class="card"><h2>Recent commits</h2><div id="commits"></div></section>
  </div>
 </div>
</main>
<script src="/ui.js"></script>
<script>
const fmt = n => n ? fmtN(n) : '';
const STAGES = ['acceptance','tester-pre','coder','tester','reviewer','merge','done'];
const STAGE_ALIAS = {'commit-tests':'coder','cleanup':'merge'};
const open = new Set(JSON.parse(localStorage.getItem('openMs') || 'null') || []);
let seenMs = new Set(JSON.parse(localStorage.getItem('seenMs') || '[]'));
const last = {};
let D = null, decisions = {};

function set(id, html) { if (last[id] !== html) { last[id] = html; $(id).innerHTML = html; } }
function setText(id, t) { if (last[id] !== t) { last[id] = t; $(id).textContent = t; } }
const empty = (t, s) => `<div class="empty"><b>${t}</b>${s || ''}</div>`;

function stageBar(t) {
  if (t.status === 'done') return `<span class="seg all" title="done">${STAGES.map(() => '<i></i>').join('')}</span>`;
  const cur = STAGES.indexOf(STAGE_ALIAS[t.stage] || t.stage), state = t.status.startsWith('waiting') ? 'wait' : t.status === 'blocked' ? 'blocked' : '';
  return `<span class="seg" title="stage: ${esc(t.stage || 'not started')}">${STAGES.map((s, i) => `<i class="${cur < 0 ? '' : i < cur ? 'past' : i === cur ? 'cur ' + state : ''}"></i>`).join('')}</span>`;
}

function board(d) {
  const groups = new Map();
  for (const m of d.milestones) groups.set(m.id, {m, tasks: []});
  groups.set('', {m: {id: '', title: 'Not in a milestone', status: ''}, tasks: []});
  for (const t of d.tasks) (groups.get(t.milestone) || groups.get('')).tasks.push(t);
  let html = '';
  for (const [id, {m, tasks}] of groups) {
    if (!tasks.length) continue;
    const done = tasks.filter(t => t.status === 'done').length, tok = tasks.reduce((a, t) => a + t.tokens, 0);
    if (!seenMs.has(id)) { seenMs.add(id); if (id === d.activeMilestone || id === '' || (done < tasks.length && done > 0)) open.add(id); }
    const stc = m.status === 'approved' ? 'ok' : m.status === 'built' ? 'warn' : '';
    html += `<details class="ms" data-id="${esc(id)}" ${open.has(id) ? 'open' : ''}><summary>
      <b>${esc(id || '–')}</b><span class="name muted">${esc(m.title)}</span>
      ${m.status ? `<span class="chip ${stc}">${esc(m.status)}</span>` : ''}
      <span class="bar"><i style="width:${100 * done / tasks.length}%"></i></span><span class="muted num" style="min-width:40px">${done}/${tasks.length}</span>
      <span class="faint num" style="min-width:52px">${fmt(tok)}</span></summary>` +
      tasks.map(t => `<div class="t ${t.status === 'done' ? 'done' : ''}" data-task="${t.num}" tabindex="0" role="button" title="Show who worked on ${t.num}">
        <span class="faint">${t.num}</span><span class="title">${esc(t.title)}</span>${stageBar(t)}
        <span>${t.fixRounds ? `<span class="chip warn" title="fix rounds">fix ${t.fixRounds}</span>` : ''}</span><span class="num faint" title="tokens">${fmt(t.tokens)}</span></div>`).join('') + '</details>';
  }
  set('board', html || empty('No tasks', 'Add specs to tasks/ and register them.'));
}
$('board').addEventListener('toggle', e => {
  const el = e.target; if (!el.dataset || el.dataset.id === undefined) return;
  el.open ? open.add(el.dataset.id) : open.delete(el.dataset.id);
  localStorage.setItem('openMs', JSON.stringify([...open])); localStorage.setItem('seenMs', JSON.stringify([...seenMs]));
}, true);

function quotaMini(d) {
  const out = [];
  for (const p of ['glm', 'kimi', 'claude']) {
    const w = Array.isArray(d.quota?.[p]) ? d.quota[p].find(x => x.window === '5h') : null;
    if (!w) { out.push(`<span class="quota" title="${p}: no data">${provDot(p)}${p} –</span>`); continue; }
    const used = w.limit ? 100 * (1 - w.remaining / w.limit) : 0, c = used > 90 ? 'low' : used > 70 ? 'mid' : '';
    out.push(`<span class="quota" title="${p} 5h window: ${w.used}/${w.limit}, resets ${fmtT(w.resetAt)}">${provDot(p)}${p}<span class="bar ${c}"><i style="width:${used.toFixed(0)}%"></i></span>${used.toFixed(0)}%</span>`);
  }
  set('qm', out.join(''));
}

function deliverables(d) {
  const list = d.milestones.filter(m => m.status === 'built' || m.id === d.activeMilestone || m.builtAt);
  set('deliv', list.length ? list.map(m => {
    const ok = (l, v) => v === undefined ? '' : `<span class="chip ${v ? 'ok' : 'bad'}">${l} ${v ? 'ok' : 'failed'}</span>`;
    return `<div class="item"><div class="row"><b>${esc(m.id)}</b><span style="flex:1" class="muted">${esc(m.title)}</span>
      <span class="chip ${m.status === 'approved' ? 'ok' : m.status === 'built' ? 'warn' : ''}">${esc(m.status || 'open')}</span></div>
      <div class="row faint" style="margin:6px 0;font-size:12px">${m.builtAt ? `built ${fmtT(m.builtAt)} · ${esc(m.commit || '')}` : 'not built yet'}
        ${m.builtAt ? ok('build', m.buildOk) + ok('tests', m.testsOk) : ''}</div>
      <div class="row">${m.built ? `<button data-play="${esc(m.id)}">Play</button>` : ''}
        ${m.status === 'built' ? `<button class="primary" data-approve="${esc(m.id)}">Approve &amp; continue</button>` : ''}</div></div>`;
  }).join('') : empty('Nothing built yet', 'Milestones appear here once they are built.'));
}

function workers(d) {
  set('workers', d.workers.length ? '<table><tbody>' + d.workers.map(w =>
    `<tr class="click" data-task="${w.task}"><td><b>${w.task}</b></td><td>${esc(w.role)}${w.heavy ? ' <span class="chip">heavy</span>' : ''}${w.resume ? ' <span class="chip">resume</span>' : ''}</td>
     <td><span class="row" style="gap:6px;flex-wrap:nowrap">${provDot(w.provider)}${esc(w.provider || '–')}</span></td><td class="n muted" title="pid ${w.pid}">${esc(w.etime)}</td></tr>`).join('') + '</tbody></table>'
    : empty('No workers running', 'Start the orchestrator to see activity.'));
}

function decisionsCard(d) {
  for (const f of d.decisions) if (!(f in decisions)) {
    decisions[f] = 'loading…';
    fetch('/api/decision?file=' + encodeURIComponent(f)).then(r => r.json()).then(j => { decisions[f] = j.content ?? j.error; renderDecisions(); });
  }
  renderDecisions();
}
function renderDecisions() {
  if (!D) return;
  set('decisions', D.decisions.length ? D.decisions.map(f => `<div class="item"><div class="row"><b style="flex:1">${esc(f)}</b>
    <button data-resolve="${esc(f)}">Resolved</button></div><pre style="margin-top:8px">${esc(decisions[f] || '')}</pre></div>`).join('') : empty('Nothing needs you', 'Planner decisions will queue here.'));
}

function events(d) {
  const q = $('evf').value.toLowerCase();
  set('events', d.events.slice().reverse().filter(e => !q || JSON.stringify(e).toLowerCase().includes(q)).map(e =>
    `<div class="ev"><span class="faint">${fmtT(e.ts)}</span><span class="muted">${esc(e.task || '–')}</span><b class="e-${esc(e.event)}">${esc(e.event)}</b><span class="muted">${esc(e.detail || '')}</span></div>`).join('')
    || empty('No events', q ? 'Nothing matches the filter.' : ''));
}

function commits(d) {
  set('commits', d.commits.map(c => { const m = c.match(/^(\S+) (\S+) (.*)$/) || [0, '', '', c];
    return `<div class="commit"><span class="mono faint">${esc(m[1])}</span><span class="faint">${fmtT(m[2])}</span><span title="${esc(m[3])}">${esc(m[3])}</span></div>`; }).join('') || empty('No commits'));
}

async function refresh() {
  try {
    D = await (await fetch('/api/status')).json();
    const d = D, am = d.milestones.find(m => m.id === d.activeMilestone);
    const scope = am ? d.tasks.filter(t => t.milestone === am.id) : d.tasks;
    const done = scope.filter(t => t.status === 'done').length;
    setText('msName', am ? `${am.id} · ${am.status || 'open'}` : 'all milestones');
    $('msName').title = am ? am.title : '';
    $('bar').style.width = (scope.length ? 100 * done / scope.length : 0) + '%';
    setText('msCount', `${done}/${scope.length} tasks`);
    setText('allCount', `${d.done}/${d.total} done overall`);
    set('orch', `<i class="dot ${d.orchestratorRunning ? 'live' : ''}"></i>${d.orchestratorRunning ? 'orchestrator running' : 'orchestrator idle'}`);
    setText('wk', `${d.workers.length} worker${d.workers.length === 1 ? '' : 's'}`);
    quotaMini(d); board(d); deliverables(d); workers(d); decisionsCard(d); events(d); commits(d);
    setText('updated', 'updated ' + fmtT(new Date()));
  } catch (e) { setText('updated', 'offline'); }
}

async function post(body) {
  const r = await fetch('/api/action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  return [r.status, await r.json()];
}
async function act(body) {
  setText('toast', body.action + '…');
  const [code, j] = await post(body);
  setText('toast', `${code} ${j.error || (j.tail ?? 'ok')}`);
  refresh();
}
$('bRun').onclick = () => act({action: 'run', only: $('only').value});
$('bStop').onclick = () => { if (confirm('Stop the orchestrator and its workers?')) act({action: 'stop'}); };
$('bTest').onclick = () => act({action: 'tests'});
$('evf').oninput = () => D && events(D);
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.resolve) { delete decisions[b.dataset.resolve]; act({action: 'resolve', file: b.dataset.resolve}); }
  else if (b.dataset.approve) { if (confirm('Approve ' + b.dataset.approve + ' and continue?')) act({action: 'approve', milestone: b.dataset.approve}); }
  else if (b.dataset.play) {
    const [, j] = await post({action: 'play', milestone: b.dataset.play});
    if (j.url) setTimeout(() => window.open(j.url, '_blank'), 800); else setText('toast', j.error);
  }
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
