<!doctype html><html><head><meta charset="utf-8"><title>Yellow flag HUD mockup</title>
<link rel="stylesheet" href="../../../src/ui/theme.css">
<style>
body{margin:0;width:1280px;height:720px;overflow:hidden;background:linear-gradient(#5b7ea8 0 38%,#3d4a3a 38% 52%,#2b2e33 52%);font-family:var(--ui-font);color:var(--ui-text)}
.road{position:absolute;left:50%;bottom:0;width:900px;height:380px;transform:translateX(-50%);background:linear-gradient(90deg,#c00 0 2%,#fff 2% 4%,#3a3d42 4% 96%,#fff 96% 98%,#c00 98%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.car{position:absolute;left:50%;bottom:30px;width:150px;height:90px;transform:translateX(-50%);background:#1d4fb8;border-radius:20px 20px 8px 8px;box-shadow:0 8px 0 #111}
.top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.pill{padding:.25em .8em;background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:var(--ui-radius);font-size:21px;font-weight:800;font-style:italic}
/* flashing yellow lights: two LED bars at the screen edges + banner */
.led{position:absolute;top:70px;width:22px;height:120px;border-radius:11px;background:#3a3205;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:6px 0;box-sizing:border-box}
.led i{width:14px;height:14px;border-radius:50%;background:#5a4a08}
.led.l{left:22px}.led.r{right:290px}
.yellow .led i{animation:blink .5s steps(1) infinite;}
.yellow .led i:nth-child(2n){animation-delay:.25s}
@keyframes blink{0%{background:#ffd400;box-shadow:0 0 14px 4px #ffd400}50%{background:#5a4a08;box-shadow:none}}
.banner{position:absolute;top:64px;left:50%;transform:translateX(-50%);padding:.35em 1.2em;border-radius:var(--ui-radius);font-size:26px;font-weight:800;font-style:italic;letter-spacing:.06em;display:none;white-space:nowrap;font-size:21px}
.yellow .banner.y{display:block;background:#ffd400;color:#14100a;animation:pulse 1s steps(1) infinite}
.double .banner.y{background:#ffd400}
@keyframes pulse{50%{background:#7a6500;color:#ffd400}}
.clear .banner.g{display:block;background:var(--ui-good);color:#06180d}
.edge{position:absolute;inset:0;pointer-events:none;display:none}
.yellow .edge{display:block;box-shadow:inset 0 0 0 6px #ffd400;animation:edge 1s steps(1) infinite}
@keyframes edge{50%{box-shadow:inset 0 0 0 6px transparent}}
canvas{position:absolute;top:12px;right:12px;width:260px;height:260px;border:1px solid var(--ui-border);border-radius:var(--ui-radius);background:var(--ui-panel)}
.legend{position:absolute;top:278px;right:12px;width:260px;font-size:13px;color:var(--ui-text-dim);text-align:center}
.cap{position:absolute;bottom:8px;left:12px;font-size:14px;background:#000a;padding:4px 8px;border-radius:6px}
</style></head><body>
<div class="road"></div><div class="car"></div>
