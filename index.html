<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sim-game</title>
    <style>
      html, body { margin: 0; overflow: hidden; }
      #game { width: 100vw; height: 100vh; display: block; }
      #hud, #status { position: fixed; }
      #hud { top: 12px; left: 12px; z-index: 10; }
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(8, 10, 14, 0.82);
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #menu .menu-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 260px;
        padding: 24px;
        background: #12161d;
        border: 1px solid #2c3542;
        border-radius: 10px;
      }
      #menu .menu-title {
        margin-bottom: 4px;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
      }
      #menu button {
        padding: 12px 16px;
        font-size: 16px;
        color: #fff;
        background: #1c2430;
        border: 1px solid #3a4657;
        border-radius: 6px;
        cursor: pointer;
      }
      #menu button:hover, #menu button:focus-visible { background: #2a3546; }
      #menu button.selected {
        border-color: #f2c200;
        box-shadow: 0 0 0 1px #f2c200;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="menu"></div>
    <div id="status">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
